<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สต๊อกสินค้า Google Sheets</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#222}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:white;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 12px #0001}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,button{padding:10px;border-radius:9px;border:1px solid #ccc}button{cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff;border:0}.good{background:#166534;color:#fff;border:0}.danger{background:#b91c1c;color:#fff;border:0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#64748b}.low{color:#b91c1c;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}}@media(max-width:480px){.row{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="wrap">
<div class="top"><div><h1>📦 ระบบสต๊อกสินค้า</h1><div class="muted">เชื่อม Google Sheets แบบออนไลน์</div></div><button onclick="refreshData()">รีเฟรช</button></div>
<div class="card"><b>ตั้งค่า Google Apps Script Web App URL</b><div class="row" style="margin-top:10px"><input id="apiUrl" style="grid-column:span 3" placeholder="https://script.google.com/macros/s/.../exec"><button class="primary" onclick="saveUrl()">บันทึก/เชื่อมต่อ</button></div><div id="status" class="muted" style="margin-top:8px">ยังไม่เชื่อมต่อ</div></div>
<div class="card"><h3>เพิ่มสินค้า</h3><div class="row"><input id="barcode" placeholder="บาร์โค้ด"><input id="name" placeholder="ชื่อสินค้า"><input id="cost" type="number" placeholder="ทุน"><input id="price" type="number" placeholder="ขาย"><input id="qty" type="number" placeholder="จำนวน" value="0"><input id="min" type="number" placeholder="ขั้นต่ำ" value="5"><button class="primary" onclick="addProduct()">บันทึกสินค้า</button></div></div>
<div class="card"><h3>ขายสินค้า</h3><div class="row"><input id="sellBarcode" placeholder="ยิง/กรอกบาร์โค้ด"><input id="sellQty" type="number" value="1" min="1"><button class="good" onclick="sell()">ขาย / ตัดสต๊อก</button></div></div>
<div class="card"><h3>รับสินค้าเข้า</h3><div class="row"><input id="inBarcode" placeholder="ยิง/กรอกบาร์โค้ด"><input id="inQty" type="number" value="1" min="1"><input id="note" placeholder="หมายเหตุ"><button class="primary" onclick="receive()">รับเข้า</button></div></div>
<div class="card"><div class="top"><h3>สินค้า</h3><input id="search" placeholder="ค้นหา" oninput="render()"></div><table><thead><tr><th>บาร์โค้ด</th><th>สินค้า</th><th>ขาย</th><th>คงเหลือ</th><th>ขั้นต่ำ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card"><h3>ยอดขายวันนี้</h3><div id="todaySales" style="font-size:28px;font-weight:800">฿0.00</div></div>
</div><script>
let products=[],tx=[];const K='stock_sheets_webapp_url_v1';const $=id=>document.getElementById(id);$('apiUrl').value=localStorage.getItem(K)||'';
function api(){return $('apiUrl').value.trim()} function money(n){return '฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2})} function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
async function getData(){const r=await fetch(api()+'?action=load');const d=await r.json();if(!d.ok)throw Error(d.error||'โหลดข้อมูลไม่ได้');products=d.products||[];tx=d.transactions||[];render();$('status').textContent='✅ เชื่อม Google Sheets แล้ว'}
async function post(body){const r=await fetch(api(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const d=await r.json();if(!d.ok)throw Error(d.error||'บันทึกไม่สำเร็จ');await getData();return d}
async function saveUrl(){if(!api())return alert('กรุณาใส่ Web App URL');localStorage.setItem(K,api());try{await getData()}catch(e){$('status').textContent='❌ '+e.message}}
async function refreshData(){try{await getData()}catch(e){alert(e.message)}}
async function addProduct(){const p={id:uid(),barcode:$('barcode').value.trim(),name:$('name').value.trim(),cost:+$('cost').value||0,price:+$('price').value||0,qty:+$('qty').value||0,min:+$('min').value||0};if(!p.barcode||!p.name)return alert('กรอกบาร์โค้ดและชื่อสินค้า');try{await post({action:'saveProduct',product:p});['barcode','name','cost','price'].forEach(x=>$(x).value='')}catch(e){alert(e.message)}}
async function sell(){const p=products.find(x=>String(x.barcode)===String($('sellBarcode').value.trim()));if(!p)return alert('ไม่พบสินค้า');const q=Math.max(1,+$('sellQty').value||1);try{await post({action:'sale',productId:p.id,qty:q,unitPrice:+p.price||0});$('sellBarcode').value=''}catch(e){alert(e.message)}}
async function receive(){const p=products.find(x=>String(x.barcode)===String($('inBarcode').value.trim()));if(!p)return alert('ไม่พบสินค้า');try{await post({action:'receive',productId:p.id,qty:Math.max(1,+$('inQty').value||1),note:$('note').value});$('inBarcode').value='';$('note').value=''}catch(e){alert(e.message)}}
async function del(id){if(!confirm('ลบสินค้านี้?'))return;try{await post({action:'deleteProduct',id})}catch(e){alert(e.message)}}
function render(){const q=$('search').value.toLowerCase();$('rows').innerHTML=products.filter(p=>String(p.name).toLowerCase().includes(q)||String(p.barcode).includes(q)).map(p=>`<tr><td>${p.barcode}</td><td>${p.name}</td><td>${money(p.price)}</td><td class="${+p.qty<=+p.min?'low':''}">${p.qty}</td><td>${p.min}</td><td><button class="danger" onclick="del('${p.id}')">ลบ</button></td></tr>`).join('')||'<tr><td colspan="6">ยังไม่มีสินค้า</td></tr>';const d=new Date().toISOString().slice(0,10);const s=tx.filter(t=>t.type==='sale'&&new Date(+t.time||t.time).toISOString().slice(0,10)===d).reduce((a,b)=>a+(+b.amount||0),0);$('todaySales').textContent=money(s)}
$('sellBarcode').addEventListener('keydown',e=>{if(e.key==='Enter')sell()});$('inBarcode').addEventListener('keydown',e=>{if(e.key==='Enter')receive()});if(api())getData().catch(()=>{});render();
</script></body></html>
